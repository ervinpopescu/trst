[package]
name = "trst"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
crossterm = { version = "0.29" }
ratatui = { version = "0.30" }
ureq = { version = "3", features = ["json", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
toml = { version = "1.1" }
dirs = { version = "6" }
unicode-width = { version = "0.2" }
base64 = { version = "0.23.1" }
keyring = { version = "3", features = [
  "sync-secret-service",
  "linux-native-sync-persistent",
  "apple-native",
  "windows-native",
] }
url = { version = "2.5.8" }

[features]
rsync = []

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"       # Maximize link-time optimization (slowest to compile, best performance)
codegen-units = 1 # Maximize optimizations across translation units (slower to compile)
strip = true      # Strip symbols from binary (reduces size)
panic = "abort"   # Disable unwinding (reduces size, slight performance bump)
opt-level = 3     # Maximum optimization level (default for release, but explicit)
