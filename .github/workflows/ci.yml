name: CI

on:
  push:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always
  PROPTEST_DISABLE_FORKING: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - name: Format
        run: cargo fmt -- --check
      - name: Lint (Clippy)
        run: cargo clippy --all-features -- -D warnings
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-llvm-cov
      - name: Build
        run: cargo build --all-features --verbose
      - name: Run tests
        run: cargo test --all-features --verbose
      - name: Coverage
        run: |
          cargo llvm-cov --tests --all-features --lcov --output-path lcov.info --ignore-filename-regex "src/test_support.rs"
          cargo llvm-cov report --ignore-filename-regex "src/test_support.rs" --fail-under-lines 95
      - name: Upload to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
